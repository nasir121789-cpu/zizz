<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Web App</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #ffffff;
        }
        
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        #appLoader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0f172a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 99999;
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }

        .spinner {
            width: 45px;
            height: 45px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-left-color: #38bdf8;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div id="appLoader">
        <div class="spinner"></div>
    </div>

    <iframe id="liveFrame"></iframe>

<script>
    const liveFrame = document.getElementById("liveFrame");
    const loader = document.getElementById("appLoader");

    function safeDecode(str) {
        try {
            return decodeURIComponent(atob(str).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
        } catch(e) {
            return str;
        }
    }

    const cachedCode = localStorage.getItem("cached_website_code");
    if (cachedCode) {
        renderCode(safeDecode(cachedCode));
        hideLoader();
    }

    const firebaseConfig = {
      apiKey: "AIzaSyBhx2m7VtuFfXZyM9qfOu1ReFHA5ZJ96vg",
      authDomain: "zizzz-6d188.firebaseapp.com",
      databaseURL: "https://zizzz-6d188-default-rtdb.firebaseio.com",
      projectId: "zizzz-6d188",
      storageBucket: "zizzz-6d188.firebasestorage.app",
      messagingSenderId: "1017543939946",
      appId: "1:1017543939946:web:bf324535e7d347b812b713"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    database.ref('cloudWebsiteCode').on('value', (snapshot) => {
        const encryptedCode = snapshot.val();
        if (encryptedCode) {
            if (encryptedCode !== cachedCode) {
                localStorage.setItem("cached_website_code", encryptedCode);
                renderCode(safeDecode(encryptedCode));
            }
            hideLoader();
        }
    });

    function renderCode(code) {
        const frameDoc = liveFrame.contentDocument || liveFrame.contentWindow.document;
        frameDoc.open();
        
        // --- উন্নত প্রক্সি ইনজেক্টর ---
        // Catbox এবং Telegram এর আপলোডে প্রক্সি বাদ দেওয়া হয়েছে যাতে বড় ফাইল আপলোডে সমস্যা না হয়
        const proxyInjector = `<script>
            (function() {
                const proxyUrl = 'https://corsproxy.io/?';
                
                // যেসব ডোমেইনে সরাসরি ভিডিও/ফাইল আপলোড হবে, সেগুলোর নাম 
                const excludedDomains = ['catbox.moe', 'api.telegram.org'];

                function shouldBypass(url) {
                    if (typeof url !== 'string') return false;
                    if (!url.startsWith('http')) return true; // Local URLs
                    if (url.includes(proxyUrl)) return true; // Already proxied
                    
                    for (let i = 0; i < excludedDomains.length; i++) {
                        if (url.includes(excludedDomains[i])) {
                            return true; // Bypass proxy for video/file upload
                        }
                    }
                    return false;
                }

                // Fetch API Overwrite
                const originalFetch = window.fetch;
                window.fetch = async function(...args) {
                    let requestUrl = args[0];
                    let isRequestObject = requestUrl instanceof Request;
                    let urlStr = isRequestObject ? requestUrl.url : requestUrl;

                    if (!shouldBypass(urlStr)) {
                        if (isRequestObject) {
                            args[0] = new Request(proxyUrl + encodeURIComponent(urlStr), requestUrl);
                        } else {
                            args[0] = proxyUrl + encodeURIComponent(urlStr);
                        }
                    }
                    return originalFetch.apply(this, args);
                };

                // XMLHttpRequest (AJAX) Overwrite
                const originalOpen = XMLHttpRequest.prototype.open;
                XMLHttpRequest.prototype.open = function(method, url, ...rest) {
                    if (!shouldBypass(url)) {
                        url = proxyUrl + encodeURIComponent(url);
                    }
                    return originalOpen.call(this, method, url, ...rest);
                };
            })();
        <\/script>`;

        // প্রক্সি স্ক্রিপ্টটি আসল কোডের সাথে যুক্ত করে রেন্ডার করা হলো
        frameDoc.write(proxyInjector + code);
        frameDoc.close();
    }

    function hideLoader() {
        if (loader) {
            loader.style.opacity = "0";
            setTimeout(() => {
                loader.style.visibility = "hidden";
            }, 400);
        }
    }
</script>

</body>
</html>
